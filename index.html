<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabriel Blue</title>
    <script src="https://cdn.jsdelivr.net/npm/@atproto/api@0.6.26/dist/index.bundle.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f7ff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        h1 { color: #0085ff; margin-bottom: 20px; }
        textarea { width: 100%; height: 100px; border: 2px solid #d0e3ff; border-radius: 10px; padding: 10px; box-sizing: border-box; resize: none; font-size: 16px; }
        button { background-color: #0085ff; color: white; border: none; padding: 15px 30px; border-radius: 25px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; transition: 0.3s; }
        button:hover { background-color: #0066cc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gabriel Blue 🚀</h1>
        <textarea id="postText" placeholder="O que você está pensando agora?"></textarea>
        <button onclick="enviarPost()">Postar no Bluesky</button>
    </div>

    <script>
        function enviarPost() {
            const texto = document.getElementById('postText').value;
            if(!texto) return alert("Escreva algo antes!");
            alert("Boa! O Gabriel Blue está quase pronto para enviar: " + texto);
        }
    </script>
</body>
</html>
