<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabriel Blue</title>
    <script src="https://cdn.jsdelivr.net/npm/@atproto/api@0.6.26/dist/index.bundle.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e6f2ff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; border: 2px solid #0085ff; }
        h1 { color: #0085ff; margin-bottom: 20px; }
        textarea { width: 100%; height: 120px; border-radius: 12px; border: 2px solid #d0e3ff; padding: 12px; font-size: 16px; box-sizing: border-box; resize: none; }
        button { background: #0085ff; color: white; border: none; padding: 15px; border-radius: 30px; width: 100%; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 15px; transition: 0.3s; }
        button:hover { background: #0066cc; }
        button:disabled { background: #ccc; }
        #status { margin-top: 15px; font-size: 14px; color: #555; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Gabriel Blue 🚀</h1>
        <textarea id="texto" placeholder="O que você está pensando?"></textarea>
        <button id="btn" onclick="postar()">Postar no Bluesky</button>
        <div id="status">Pronto para decolar!</div>
    </div>

    <script>
        async function postar() {
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');
            const texto = document.getElementById('texto').value;

            if(!texto) return alert("Escreva algo primeiro!");

            btn.disabled = true;
            status.innerText = "⏳ Conectando...";

            try {
                // Jeito correto de acessar a biblioteca no navegador
                const { BskyAgent } = window.atproto;
                const agent = new BskyAgent({ service: 'https://bsky.social' });

                await agent.login({
                    identifier: 'gsooficial.bsky.social',
                    password: 'ujk4-cdf7-25we-5oxy' // <--- COLOQUE SUA SENHA DE APP AQUI
                });

                await agent.post({
                    text: texto,
                    createdAt: new Date().toISOString()
                });

                status.style.color = "green";
                status.innerText = "✅ SUCESSO! Veja no seu perfil.";
                document.getElementById('texto').value = "";
            } catch (e) {
                status.style.color = "red";
                status.innerText = "❌ Erro: " + e.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
