<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gabriel Blue</title>

    <script src="https://unpkg.com/@atproto/api"></script>

    <style>

        body { font-family: sans-serif; background-color: #e6f2ff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }

        .box { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; text-align: center; border: 2px solid #0085ff; }

        h1 { color: #0085ff; font-size: 24px; margin-top: 0; }

        textarea { width: 100%; height: 100px; border-radius: 10px; border: 1px solid #ccc; padding: 10px; margin: 10px 0; font-size: 16px; box-sizing: border-box; }

        button { background: #0085ff; color: white; border: none; padding: 12px; border-radius: 25px; width: 100%; cursor: pointer; font-weight: bold; }

        #status { margin-top: 15px; font-size: 14px; color: #666; font-weight: bold; }

    </style>

</head>

<body>

    <div class="box">

        <h1>Gabriel Blue 🚀</h1>

        <textarea id="texto" placeholder="O que você vai postar hoje?"></textarea>

        <button id="btn" onclick="postar()">Postar no Bluesky</button>

        <div id="status">Aguardando...</div>

    </div>



    <script>

        async function postar() {

            const btn = document.getElementById('btn');

            const status = document.getElementById('status');

            const texto = document.getElementById('texto').value;



            if(!texto) return alert("Escreva algo primeiro!");



            btn.disabled = true;

            status.innerText = "🚀 Conectando ao Bluesky...";



            try {

                // JEITO NOVO DE CHAMAR O AGENTE

                const agent = new atproto.BskyAgent({ service: 'https://bsky.social' });



                await agent.login({

                    identifier: 'gsooficial.bsky.social',

                    password: 'ujk4-cdf7-25we-5oxy' // <--- COLOQUE SUA SENHA AQUI

                });



                await agent.post({

                    text: texto,

                    createdAt: new Date().toISOString()

                });



                status.style.color = "green";

                status.innerText = "✅ POSTADO COM SUCESSO!";

                document.getElementById('texto').value = "";

            } catch (e) {

                status.style.color = "red";

                status.innerText = "❌ Erro: " + e.message;

                console.error(e);

            } finally {

                btn.disabled = false;

            }

        }

    </script>

</body>

</html>
